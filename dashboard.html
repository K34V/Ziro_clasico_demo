<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Inicio · I.E. General Alfredo Vásquez Cobo</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FDFBF7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <!-- Fondo decorativo, coherente con la Splash Screen -->
  <div class="bg-sky" aria-hidden="true"></div>
  <div class="bg-blob bg-blob--gold" aria-hidden="true"></div>
  <div class="bg-blob bg-blob--sky" aria-hidden="true"></div>

  <div class="app">

    <!-- ===== Header ===== -->
    <header class="header">
      <p class="header__greeting">Hola, <span id="userName">Aventurero</span> 👋</p>
      <div class="header__avatar" aria-label="Foto de perfil">
        <!-- Placeholder: reemplaza por <img src="assets/img/perfil.png" alt="Foto de perfil"> cuando exista la foto real -->
      </div>
    </header>

    <!-- ===== Zona del guía: Ziro ===== -->
    <section class="guide" aria-label="Mensaje de tu guía Ziro">
      <img class="guide__avatar" src="assets/img/1000147289.png" alt="Ziro, tu guía zorro">
      <p class="guide__message">¡Bienvenido! Ziro te estaba esperando para comenzar la aventura.</p>
    </section>

    <!-- ===== Grid de módulos ===== -->
    <section class="modules" aria-label="Módulos principales">

      <a href="#" class="card">
        <img class="card__icon" src="assets/img/1000147292.png" alt="Momento de Paz">
        <span class="card__title">Momento de Paz</span>
        <span class="card__subtitle">Encuentra tu centro.</span>
      </a>

      <a href="#" class="card">
        <img class="card__icon" src="assets/img/1000147291.png" alt="El Tesoro de los Dioses">
        <span class="card__title">El Tesoro de los Dioses</span>
        <span class="card__subtitle">Descubre recompensas.</span>
      </a>

      <a href="#" class="card">
        <img class="card__icon" src="assets/img/1000147290.png" alt="Misiones Diarias">
        <span class="card__title">Misiones Diarias</span>
        <span class="card__subtitle">Tus retos de hoy.</span>
      </a>

    </section>

  </div>

  <!-- ===== Bottom Navigation ===== -->
  <nav class="bottom-nav" aria-label="Navegación principal">
    <a href="dashboard.html" class="bottom-nav__item bottom-nav__item--active">
      <span class="bottom-nav__icon">🏠</span>
      <span class="bottom-nav__label">Inicio</span>
    </a>
    <a href="#" class="bottom-nav__item">
      <span class="bottom-nav__icon">📚</span>
      <span class="bottom-nav__label">Lecciones</span>
    </a>
    <a href="#" class="bottom-nav__item">
      <span class="bottom-nav__icon">🎮</span>
      <span class="bottom-nav__label">Juegos</span>
    </a>
    <a href="#" class="bottom-nav__item">
      <span class="bottom-nav__icon">👤</span>
      <span class="bottom-nav__label">Perfil</span>
    </a>
  </nav>

  <script>
    (function () {
      const STORAGE_KEY = "userName";
      let name = localStorage.getItem(STORAGE_KEY);

      if (!name) {
        name = prompt("¿Cómo te llamas, aventurero?");
        if (name && name.trim() !== "") {
          name = name.trim();
          localStorage.setItem(STORAGE_KEY, name);
        } else {
          name = "Aventurero";
        }
      }

      document.getElementById("userName").textContent = name;
    })();
  </script>

</body>
</html>
